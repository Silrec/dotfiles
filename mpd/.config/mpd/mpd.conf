music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
sticker_file        "~/.local/share/mpd/sticker.sql"
state_file          "~/.local/state/mpd/state"

bind_to_address     "127.0.0.1"     # only reachable from this PC
auto_update         "yes"           # notice new/changed files in ~/Music automatically
restore_paused      "yes"           # after login, resume paused instead of blasting music
replaygain          "auto"          # album gain when playing albums, track gain otherwise

audio_output {
    type  "pipewire"
    name  "PipeWire"
}
